name: SignLearn CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Linting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Code Formatting & Linting Check (Black, flake8)
        run: |
          black --check backend/app
          flake8 backend/app

      - name: Backend Unit Tests (Pytest)
        run: |
          cd backend
          pytest

  frontend-checks:
    name: Frontend Type-Check & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check --workspace=frontend

      - name: Next.js Production Build Test
        run: npm run build --workspace=frontend
