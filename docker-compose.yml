version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: signlearn_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signlearn_secret}
      POSTGRES_DB: ${POSTGRES_DB:-signlearn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signlearn} -d ${POSTGRES_DB:-signlearn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signlearn_network

  mongodb:
    image: mongo:7.0
    container_name: signlearn_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-signlearn_nosql}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signlearn_network

  redis:
    image: redis:7-alpine
    container_name: signlearn_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signlearn_network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: signlearn_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-signlearn}:${POSTGRES_PASSWORD:-signlearn_secret}@postgres:5432/${POSTGRES_DB:-signlearn_db}
      - MONGODB_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_secret}@mongodb:27017/${MONGO_DB:-signlearn_nosql}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_signlearn_2026}
      - SECRET_KEY=${SECRET_KEY:-signlearn_app_secret_key_change_me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signlearn_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: signlearn_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - signlearn_network

  nginx:
    image: nginx:alpine
    container_name: signlearn_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - signlearn_network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  signlearn_network:
    driver: bridge
